<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS Yayın</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080a0f;color:#fff;display:grid;place-items:center;min-height:100vh}
.card{width:min(700px,92vw);background:#11151e;border:1px solid #292f3d;border-radius:22px;padding:36px;box-shadow:0 25px 80px #0008;text-align:center}
h1{margin:0 0 10px;font-size:38px}.red{color:#ef4444}.muted{color:#9aa2b3}
button{border:0;border-radius:12px;padding:14px 20px;background:#ef4444;color:white;font-weight:800;font-size:16px;cursor:pointer}
.room{margin-top:20px;padding:16px;border-radius:12px;background:#0b0e14;min-height:52px;word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:24px;font-weight:900">🔥 MS <span class="red">YAYIN</span></div>
  <h1>Yayın Yönetim Sistemi</h1>
  <p class="muted">Yeni bir yayın odası oluştur. Room kodu otomatik verilir.</p>
  <button id="newRoom">🟢 YENİ YAYIN BAŞLAT</button>
  <div id="result" class="room">Hazır.</div>
</div>
<script>
document.getElementById("newRoom").addEventListener("click", async () => {
  const result = document.getElementById("result");
  result.textContent = "Oda oluşturuluyor...";
  try {
    const response = await fetch("/api/rooms", {method:"POST"});
    const data = await response.json();
    if (!data.ok) throw new Error(data.message || "Oda oluşturulamadı.");
    localStorage.setItem("ms_room", data.room);
    window.location.href = data.panelUrl;
  } catch (e) {
    result.textContent = e.message;
  }
});
</script>
</body>
</html>
