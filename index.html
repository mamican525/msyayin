<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MS Yayın</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="landing">
  <main class="landing-card">
    <div class="brand">🔥 MS <span>YAYIN</span></div>
    <h1>Yayın Yönetim Sistemi</h1>
    <p>Yeni yayınını başlat. Room kodun otomatik oluşturulsun ve bütün overlay'ların aynı odaya bağlansın.</p>
    <button id="createRoom" class="primary large">🟢 YENİ YAYIN BAŞLAT</button>
    <div id="result" class="result hidden"></div>
  </main>
  <script>
    const result = document.getElementById('result');
    document.getElementById('createRoom').addEventListener('click', async () => {
      const button = document.getElementById('createRoom');
      button.disabled = true;
      button.textContent = '⏳ ODA OLUŞTURULUYOR...';
      result.classList.add('hidden');
      try {
        const response = await fetch('/api/rooms', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || 'Room oluşturulamadı.');
        localStorage.setItem('ms_room', data.room);
        window.location.href = '/panel?room=' + encodeURIComponent(data.room);
      } catch (error) {
        result.textContent = error.message;
        result.classList.remove('hidden');
        button.disabled = false;
        button.textContent = '🟢 YENİ YAYIN BAŞLAT';
      }
    });
  </script>
</body>
</html>
