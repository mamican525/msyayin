<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MS YAYIN OVERLAY</title><style>html,body{margin:0;width:100%;height:100%;background:transparent;color:#fff;font-family:Arial,sans-serif}.wrap{height:100%;display:grid;place-items:center}.box{min-width:320px;padding:24px 30px;background:rgba(8,9,13,.86);border:1px solid rgba(255,255,255,.16);border-radius:18px;text-align:center}.t{font-size:20px;font-weight:800}.big{font-size:52px;font-weight:900;margin:12px 0}.muted{opacity:.7}</style><div class="wrap"><div class="box" id="box"><div class="t">🔥 MS YAYIN</div><div class="muted">Overlay hazır</div></div></div><script>const p=new URLSearchParams(location.search),type=p.get('type')||'score',key='msyayin_state';function draw(){let s=JSON.parse(localStorage.getItem(key)||'null');let b=document.getElementById('box');if(!s){b.innerHTML='<div class=t>MS YAYIN</div><div class=muted>Oda bulunamadı</div>';return}let h='';if(type==='score'){let a=s.votes?.length?s.votes.reduce((x,v)=>x+v.score,0)/s.votes.length:0;h='<div class=t>⭐ PUANLAMA</div><div class=big>'+a.toFixed(2)+'</div><div class=muted>'+((s.votes||[]).length)+' oy</div>'}else if(type==='racon'){let x=(s.people?.racon||[]).slice(-1)[0];h='<div class=t>👑 RACON KRALI</div><div class=big>'+(x?'@'+x.user:'')+'</div>'}else if(type==='mekan'){let x=(s.people?.mekan||[]).slice(-1)[0];h='<div class=t>🏠 MEKAN SAHİBİ</div><div class=big>'+(x?'@'+x.user:'')+'</div>'}else if(type==='likes'){let a=Object.entries(s.likes||{}).sort((x,y)=>y[1]-x[1]).slice(0,5);h='<div class=t>❤️ BEĞENİ SIRALAMASI</div>'+a.map((x,i)=>'<div>'+(i+1)+'. @'+x[0]+' — '+x[1]+' ❤️</div>').join('')}else if(type==='win'){h='<div class=t>🏆 WIN</div><div class=big>'+String(s.win||0).padStart(2,'0')+'/20</div>'}b.innerHTML=h||'<div class=t>MS YAYIN</div>'}draw();setInterval(draw,500);</script></html>
