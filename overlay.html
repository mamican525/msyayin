<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MS Yayın Overlay</title>
  <link rel="stylesheet" href="/style.css">
  <style>body{background:transparent;overflow:hidden}.overlay-stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.overlay-card{min-width:360px;max-width:92vw;background:rgba(8,9,14,.90);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:26px;box-shadow:0 20px 80px rgba(0,0,0,.38);text-align:center}.overlay-title{font-size:22px;font-weight:800}.overlay-big{font-size:64px;font-weight:950;margin:12px 0}.overlay-sub{color:#aeb5c6}.rank-line{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}.rank-line:last-child{border-bottom:0}.pulse{animation:pulse .65s ease}@keyframes pulse{50%{transform:scale(1.04);filter:brightness(1.25)}}</style>
</head>
<body>
<div class="overlay-stage"><div id="overlay" class="overlay-card"><div class="overlay-title">🔥 MS YAYIN</div><div class="overlay-sub">Bekleniyor...</div></div></div>
<script>
const q=new URLSearchParams(location.search);const room=(q.get('room')||'').toUpperCase();const type=q.get('type')||'puanlama';let lastGiftTime=0;
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function render(s){const el=document.getElementById('overlay');let html='';
 if(type==='puanlama'){const left=s.scoring?Math.max(0,Math.ceil((s.scoreEndsAt-Date.now())/1000)):0;html=`<div class="overlay-title">⭐ PUANLAMA</div><div class="overlay-big">${s.average}</div><div class="overlay-sub">${s.participants} katılımcı • ${left} sn</div>`;}
 else if(type==='racon'){const first=s.raconEntries?.[0];html=`<div class="overlay-title">👑 RACON KRALI</div>${first?`<div class="overlay-big">@${esc(first.username)}</div><div class="overlay-sub">🎁 ${esc(first.gift)} • ${first.count}x</div>`:'<div class="overlay-sub">Hediye bekleniyor...</div>'}`;}
 else if(type==='mekan'){const first=s.mekanEntries?.[0];html=`<div class="overlay-title">🏠 MEKAN SAHİBİ</div>${first?`<div class="overlay-big">@${esc(first.username)}</div><div class="overlay-sub">🎁 ${esc(first.gift)} • ${first.count}x</div>`:'<div class="overlay-sub">Hediye bekleniyor...</div>'}`;}
 else if(type==='begeni'){html=`<div class="overlay-title">❤️ BEĞENİ SIRALAMASI</div>`+(s.likes?.slice(0,10).map((x,i)=>`<div class="rank-line"><span>${i<3?['🥇','🥈','🥉'][i]:i+1+'.'} @${esc(x.username)}</span><b>${Number(x.likeCount).toLocaleString('tr-TR')} ❤️</b></div>`).join('')||'<div class="overlay-sub">Beğeni bekleniyor...</div>');}
 else if(type==='win'){html=`<div class="overlay-title">🏆 WIN</div><div class="overlay-big">${String(s.wins).padStart(2,'0')}<span style="font-size:28px">/20</span></div><div class="overlay-sub">CEZA: -${s.penalty}</div>`;}
 el.innerHTML=html;
 if(s.lastGift&&s.lastGift.time!==lastGiftTime&&((type==='racon'&&s.lastGift.category==='racon')||(type==='mekan'&&s.lastGift.category==='mekan'))){lastGiftTime=s.lastGift.time;el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');}
}
async function load(){if(!room){document.getElementById('overlay').innerHTML='<div class="overlay-sub">ROOM kodu eksik.</div>';return;}try{const r=await fetch('/api/state?room='+encodeURIComponent(room));const d=await r.json();if(d.ok)render(d.state);}catch(_){}}
load();setInterval(load,1000);
</script>
</body>
</html>
