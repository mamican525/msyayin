<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS Yayın Paneli</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#090a0f;color:#f5f5f5}.panel{display:flex;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:255px;background:#0f1118;border-right:1px solid #252936;padding:20px}.logo{font-size:22px;font-weight:900;margin-bottom:22px}.logo span{color:#e53935}.nav button,.newpub{width:100%;border:0;background:transparent;color:#cbd0dc;text-align:left;padding:11px 12px;border-radius:10px;margin:3px 0;cursor:pointer;font-weight:700}.nav button:hover,.nav button.active,.newpub:hover{background:#1b1f29;color:#fff}.main{margin-left:255px;width:calc(100% - 255px);padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px;flex-wrap:wrap}.roombox{background:#11141d;border:1px solid #252a37;padding:12px 15px;border-radius:12px}.card{background:#11141d;border:1px solid #252a37;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{font-size:30px;font-weight:900}.muted{color:#9097a7}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#e53935;color:#fff;font-weight:800}button.green{background:#16804b}button.gold{background:#8f6812}button.dark{background:#252a36}button.danger{background:#a51f2a}input,select{background:#141821;color:#fff;border:1px solid #303646;border-radius:10px;padding:10px;min-width:180px}.list{max-height:390px;overflow:auto}.item{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid #252a36}.badge{display:inline-block;border-radius:999px;padding:4px 9px;background:#252a36}.links{word-break:break-all;background:#0c0f15;padding:10px;border-radius:10px}.guide li{margin:10px 0}.toast{position:fixed;right:25px;bottom:25px;background:#1d2430;padding:14px 18px;border-radius:12px;border:1px solid #3a4050;display:none;z-index:10}
@media(max-width:850px){.side{width:200px}.main{margin-left:200px;width:calc(100% - 200px)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="panel">
  <aside class="side">
    <div class="logo">🔥 MS <span>YAYIN</span></div>
    <div class="nav">
      <button data-tab="connection">🔴 Yayın Bağlantısı</button>
      <button data-tab="score">⭐ Puanlama</button>
      <button data-tab="racon">👑 Racon Kralları</button>
      <button data-tab="mekan">🏠 Mekan Sahibi</button>
      <button data-tab="likes">❤️ Beğeni Sıralaması</button>
      <button data-tab="win">🏆 WIN Sayacı</button>
      <button data-tab="test">🧪 Test Merkezi</button>
      <button data-tab="guide">📖 Kullanım Rehberi</button>
    </div>
    <button class="dark newpub" id="newPub">🆕 Yeni Yayın</button>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <h1 style="margin:0 0 6px">Yayın Yönetim Paneli</h1>
        <div class="muted">Room otomatik oluşturuldu · bütün overlaylar aynı odaya bağlı</div>
      </div>
      <div class="roombox">ROOM: <b id="roomLabel">—</b></div>
    </div>
    <div id="app"></div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
const socket = io();
const params = new URLSearchParams(window.location.search);
let room = (params.get("room") || localStorage.getItem("ms_room") || "").toUpperCase();
let state = null;

if (!room) window.location.href = "/";

localStorage.setItem("ms_room", room);
document.getElementById("roomLabel").textContent = room;
socket.emit("join", room);

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.style.display = "none", 2500);
}

async function post(url, body = {}){
  const response = await fetch(url, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({room}, body))
  });
  const data = await response.json();
  if (!response.ok) toast(data.message || "İşlem başarısız.");
  return data;
}

async function loadState(){
  const response = await fetch("/api/state?room=" + encodeURIComponent(room));
  state = await response.json();
}

function overlayUrl(type){
  return window.location.origin + "/overlay?room=" + encodeURIComponent(room) + "&type=" + encodeURIComponent(type);
}

function overlayBox(type){
  const url = overlayUrl(type);
  return '<div class="card"><b>🎥 Overlay Linki</b><div class="links" style="margin:10px 0">' +
    url +
    '</div><button class="dark" onclick="navigator.clipboard.writeText(' +
    JSON.stringify(url) +
    ').then(()=>toast(\'Overlay linki kopyalandı.'))">📋 Linki Kopyala</button></div>';
}

function giftSelect(id){
  const catalog = (state && state.giftCatalog) || [];
  const options = catalog.map(g => '<option value="' + escapeHtml(g) + '">' + escapeHtml(g) + '</option>').join("");
  return '<select id="' + id + '">' + options + '</select>';
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function render(tab){
  if (!state) return;
  let html = "";

  if(tab === "connection"){
    html =
      '<div class="card"><h2>🔴 Yayın Bağlantısı</h2>' +
      '<p class="muted">TikTok kullanıcı adını yaz. Bu yayın odasına bağlanır.</p>' +
      '<div class="row"><input id="ttuser" placeholder="@kullanici"><button onclick="connectTikTok()">BAĞLAN</button></div>' +
      '<p>Durum: <b>' + (state.connected ? "🟢 BAĞLI" : "🔴 BAĞLI DEĞİL") + '</b></p></div>';
  }

  if(tab === "score"){
    const left = state.scoring ? Math.max(0, Math.ceil((state.scoreEndsAt - Date.now())/1000)) : 0;
    const votes = (state.votes || []).map(v =>
      '<div class="item"><span>@' + escapeHtml(v.username) + '</span><b>' + v.score + '</b></div>'
    ).join("");
    html =
      '<div class="card"><h2>⭐ Puanlama</h2>' +
      '<div class="row"><label>Süre <input id="duration" type="number" min="1" max="3600" value="' + state.scoreDuration + '"> saniye</label>' +
      '<button class="dark" onclick="saveDuration()">Kaydet</button>' +
      '<button class="green" onclick="startScore()">PUANLAMAYI BAŞLAT</button>' +
      '<button class="danger" onclick="stopScore()">BİTİR</button></div>' +
      '<div class="grid" style="margin-top:15px">' +
      '<div class="card"><span class="muted">Ortalama</span><div class="stat">' + state.average + '</div></div>' +
      '<div class="card"><span class="muted">Katılımcı</span><div class="stat">' + state.participants + '</div></div>' +
      '<div class="card"><span class="muted">Kalan</span><div class="stat">' + (state.scoring ? left + " sn" : "—") + '</div></div></div>' +
      '<div class="list">' + (votes || '<div class="muted">Henüz puan yok.</div>') + '</div></div>' +
      overlayBox("puanlama");
  }

  if(tab === "racon"){
    const rules = (state.giftRules || []).filter(r => r.type === "racon");
    const list = rules.map(r =>
      '<div class="item"><span>🎁 ' + escapeHtml(r.gift) + '</span><button class="danger" onclick="deleteRule(\'racon\',' + JSON.stringify(r.gift) + ')">Sil</button></div>'
    ).join("");
    html =
      '<div class="card"><h2>👑 Racon Kralları</h2>' +
      '<p class="muted">Hediyeyi listeden seç. Seçilen hediye gelince gönderen otomatik kaydedilir.</p>' +
      '<div class="row">' + giftSelect("raconGift") + '<button onclick="addRule(\'racon\')">➕ Hediye Ekle</button></div>' +
      '<div class="list" style="margin-top:12px">' + (list || '<div class="muted">Henüz hediye seçilmedi.</div>') + '</div></div>' +
      overlayBox("racon");
  }

  if(tab === "mekan"){
    const rules = (state.giftRules || []).filter(r => r.type === "mekan");
    const list = rules.map(r =>
      '<div class="item"><span>🎁 ' + escapeHtml(r.gift) + '</span><button class="danger" onclick="deleteRule(\'mekan\',' + JSON.stringify(r.gift) + ')">Sil</button></div>'
    ).join("");
    html =
      '<div class="card"><h2>🏠 Mekan Sahibi</h2>' +
      '<p class="muted">Hediyeyi listeden seç. Seçilen hediye gelince gönderen otomatik kaydedilir.</p>' +
      '<div class="row">' + giftSelect("mekanGift") + '<button onclick="addRule(\'mekan\')">➕ Hediye Ekle</button></div>' +
      '<div class="list" style="margin-top:12px">' + (list || '<div class="muted">Henüz hediye seçilmedi.</div>') + '</div></div>' +
      overlayBox("mekan");
  }

  if(tab === "likes"){
    const list = (state.likes || []).map((v,i) =>
      '<div class="item"><span>' + (i<3 ? ["🥇","🥈","🥉"][i] + " " : "") + '@' + escapeHtml(v.username) + '</span><b>' +
      Number(v.likeCount).toLocaleString("tr-TR") + ' ❤️</b></div>'
    ).join("");
    html =
      '<div class="card"><h2>❤️ Beğeni Sıralaması</h2>' +
      '<button class="danger" onclick="resetLikes()">Beğenileri Sıfırla</button>' +
      '<div class="list" style="margin-top:10px">' + (list || '<div class="muted">Henüz beğeni yok.</div>') + '</div></div>' +
      overlayBox("begeni");
  }

  if(tab === "win"){
    html =
      '<div class="card"><h2>🏆 WIN Sayacı</h2><div class="stat">' +
      String(state.wins).padStart(2,"0") + ' / 20</div>' +
      '<div class="row" style="margin-top:15px"><button onclick="changeWin(1)">+ WIN</button>' +
      '<button class="danger" onclick="changeWin(-1)">- WIN</button>' +
      '<button class="gold" onclick="resetWin()">SIFIRLA</button></div></div>' +
      overlayBox("win");
  }

  if(tab === "test"){
    html =
      '<div class="card"><h2>🧪 Test Merkezi</h2><p class="muted">Gerçek yayın gelmiş gibi test verisi gönder.</p>' +
      '<div class="row"><input id="testUser" value="test_kullanici"><input id="testScore" type="number" min="1" max="10" value="10"><button onclick="testVote()">⭐ Test Puanı</button></div>' +
      '<div class="row" style="margin-top:10px">' + giftSelect("testGift") + '<button onclick="testGift()">🎁 Test Hediye</button></div>' +
      '<div class="row" style="margin-top:10px"><input id="testLikes" type="number" value="100"><button onclick="testLike()">❤️ Test Beğeni</button></div></div>';
  }

  if(tab === "guide"){
    html =
      '<div class="card"><h2>📖 Kullanım Rehberi</h2><ol>' +
      '<li>Yeni yayın başlatıldığında Room kodu otomatik oluşturulur.</li>' +
      '<li>TikTok kullanıcı adını Yayın Bağlantısı bölümünden bağla.</li>' +
      '<li>Racon ve Mekan bölümlerinde hediyeyi listeden seç.</li>' +
      '<li>Puanlama süresini ayarla ve başlat.</li>' +
      '<li>Overlay linkini OBS veya TikTok Live Studio Browser Source olarak ekle.</li>' +
      '</ol></div>';
  }

  document.getElementById("app").innerHTML = html;
  if(tab === "score") window.__activeTab = "score";
}

async function connectTikTok(){
  const username = document.getElementById("ttuser").value;
  const result = await post("/api/connect",{username});
  toast(result.message || "");
}

async function saveDuration(){
  await post("/api/duration",{duration:Number(document.getElementById("duration").value)});
  await loadState(); render("score");
  toast("Puanlama süresi kaydedildi.");
}

async function startScore(){ await post("/api/score/start"); await loadState(); render("score"); toast("Puanlama başladı."); }
async function stopScore(){ await post("/api/score/stop"); await loadState(); render("score"); toast("Puanlama bitti."); }
async function addRule(type){
  const id = type === "racon" ? "raconGift" : "mekanGift";
  await post("/api/rule",{gift:document.getElementById(id).value,type});
  await loadState(); render(type); toast("Hediye kuralı eklendi.");
}
async function deleteRule(type,gift){
  await post("/api/rule/delete",{type,gift});
  await loadState(); render(type); toast("Kural silindi.");
}
async function resetLikes(){ await post("/api/likes/reset"); await loadState(); render("likes"); }
async function changeWin(change){ await post("/api/win",{change}); await loadState(); render("win"); }
async function resetWin(){ await post("/api/win",{change:0}); await loadState(); render("win"); }
async function testVote(){ await post("/api/test/vote",{username:document.getElementById("testUser").value,score:Number(document.getElementById("testScore").value)}); }
async function testGift(){ await post("/api/test/gift",{username:document.getElementById("testUser").value,gift:document.getElementById("testGift").value}); }
async function testLike(){ await post("/api/test/like",{username:document.getElementById("testUser").value,count:Number(document.getElementById("testLikes").value)}); }

document.querySelectorAll(".nav button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
    render(button.dataset.tab);
  });
});

document.getElementById("newPub").addEventListener("click", () => { window.location.href = "/"; });

socket.on("state", next => {
  if (next.room !== room) return;
  state = next;
  const active = document.querySelector(".nav button.active");
  render(active ? active.dataset.tab : "connection");
});

loadState().then(() => render("connection"));
</script>
</body>
</html>
