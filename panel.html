<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MS YAYIN PANELİ</title><style>
*{box-sizing:border-box}body{margin:0;background:#07080c;color:#f5f5f7;font-family:Arial,sans-serif}.layout{min-height:100vh;display:flex}.side{position:fixed;left:0;top:0;bottom:0;width:255px;background:#0d1017;border-right:1px solid #272d39;padding:20px}.brand{font-size:24px;font-weight:900;margin-bottom:20px}.brand span{color:#e53935}.nav{display:flex;flex-direction:column;gap:4px}.nav button,.newShow{border:0;background:transparent;color:#bfc5d1;text-align:left;padding:11px 12px;border-radius:10px;font-weight:800;cursor:pointer}.nav button:hover,.nav button.active,.newShow:hover{background:#1a1f29;color:#fff}.newShow{background:#232936;margin-top:12px;width:100%}.main{margin-left:255px;width:calc(100% - 255px);padding:28px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap;margin-bottom:20px}.title{margin:0 0 7px;font-size:31px}.muted{color:#9299a9}.room{background:#12161f;border:1px solid #2b3140;border-radius:11px;padding:10px 13px}.card{background:#10131b;border:1px solid #252b38;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{font-size:30px;font-weight:900}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field,select,input{background:#151923;border:1px solid #303747;color:#fff;border-radius:9px;padding:10px}.btn{border:0;border-radius:10px;background:#e53935;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.btn.dark{background:#2a303c}.btn.green{background:#16824e}.btn.gold{background:#977014}.btn.danger{background:#a8242f}.list{max-height:420px;overflow:auto}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid #252b38}.pill{display:inline-flex;background:#282f3d;border-radius:999px;padding:4px 9px;font-size:12px}.overlayLink{background:#0b0e14;border:1px dashed #3a4150;border-radius:9px;padding:10px;word-break:break-all;font-size:12px;margin-top:8px}.person{display:flex;gap:10px;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;background:#262c38;object-fit:cover}.small{font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#1b2230;border:1px solid #394150;border-radius:11px;padding:12px 16px;display:none}.guide li{margin:9px 0}
@media(max-width:850px){.side{width:205px}.main{margin-left:205px;width:calc(100% - 205px)}.grid{grid-template-columns:1fr}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">🔥 MS <span>YAYIN</span></div><nav class="nav"><button data-tab="connection">🔴 Yayın Bağlantısı</button><button data-tab="score">⭐ Puanlama</button><button data-tab="racon">👑 Racon Kralları</button><button data-tab="mekan">🏠 Mekan Sahibi</button><button data-tab="likes">❤️ Beğeni Sıralaması</button><button data-tab="win">🏆 WIN Sayacı</button><button data-tab="test">🧪 Test Merkezi</button><button data-tab="guide">📖 Kullanım Rehberi</button></nav><button id="newShow" class="newShow">🆕 Yeni Yayın</button></aside><main class="main"><div class="top"><div><h1 class="title">Yayın Yönetim Paneli</h1><div class="muted">Room otomatik oluşturuldu · bütün sistemler aynı odaya bağlı</div></div><div class="room">ROOM: <b id="roomLabel">—</b></div></div><div id="app"></div></main></div><div id="toast" class="toast"></div>
<script>
const params=new URLSearchParams(location.search);let room=(params.get('room')||localStorage.getItem('ms_room')||'').toUpperCase();if(!room){location.href='/';}else{localStorage.setItem('ms_room',room);}const app=document.getElementById('app');document.getElementById('roomLabel').textContent=room;let state=null,current='connection';
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const overlayUrl=t=>location.origin+'/overlay/'+encodeURIComponent(t)+'?room='+encodeURIComponent(room);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display='none',2200)}
async function getState(){try{state=await fetch('/api/state?room='+encodeURIComponent(room),{cache:'no-store'}).then(r=>r.json());render(current);}catch(e){toast('Durum alınamadı.');}}
async function post(path,body={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room,...body})});const d=await r.json();if(!r.ok)toast(d.message||'Hata');else{state=d;render(current);}return d}
function overlayCard(type){const url=overlayUrl(type);return '<div class="card"><b>🎥 Overlay Linki</b><div class="overlayLink">'+esc(url)+'</div><div class="row" style="margin-top:9px"><button class="btn dark" onclick="copyLink('+JSON.stringify(url)+')">📋 Kopyala</button><button class="btn dark" onclick="window.open('+JSON.stringify(url)+',\'_blank\')">👁️ Önizle</button></div></div>'}
async function copyLink(v){try{await navigator.clipboard.writeText(v);toast('Overlay linki kopyalandı.');}catch(_){toast('Link kopyalanamadı.')}}
function giftSelect(id){return '<select id="'+id+'">'+(state?.giftCatalog||[]).map(g=>'<option value="'+esc(g)+'">🎁 '+esc(g)+'</option>').join('')+'</select>'}
function render(tab){current=tab;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let h='';
if(tab==='connection')h='<div class="card"><h2>🔴 Yayın Bağlantısı</h2><p class="muted">TikTok kullanıcı adını gir. Bağlantı sadece bu Room için çalışır.</p><div class="row"><input class="field" id="ttuser" placeholder="@kullanici" value="'+esc(state?.username||'')+'"><button class="btn" onclick="connectTikTok()">BAĞLAN</button></div><p>Durum: <b>'+ (state?.connected?'🟢 BAĞLI':'🔴 BAĞLI DEĞİL') +'</b></p>'+(!state?.connected?'':'<div class="pill">@'+esc(state.username)+' bağlantısı aktif</div>')+'</div>'+overlayCard('all');
if(tab==='score'){const left=state?.scoring?Math.max(0,Math.ceil((state.scoreEndsAt-Date.now())/1000)):0;h='<div class="card"><h2>⭐ Puanlama</h2><div class="row"><label>Süre <input id="duration" class="field" type="number" min="1" max="3600" value="'+(state?.scoreDuration||15)+'"> saniye</label><button class="btn dark" onclick="saveDuration()">Kaydet</button><button class="btn green" onclick="startScore()">PUANLAMAYI BAŞLAT</button><button class="btn danger" onclick="stopScore()">BİTİR</button></div><div class="grid" style="margin-top:14px"><div class="card"><span class="muted">Ortalama</span><div class="stat">'+(state?.average||0)+'</div></div><div class="card"><span class="muted">Katılımcı</span><div class="stat">'+(state?.participants||0)+'</div></div><div class="card"><span class="muted">Kalan</span><div class="stat">'+(state?.scoring?left+' sn':'—')+'</div></div></div><div class="list">'+((state?.votes||[]).map(v=>'<div class="item"><span>@'+esc(v.username)+'</span><b>'+v.score+'</b></div>').join('')||'<div class="muted">Henüz oy yok.</div>')+'</div></div>'+overlayCard('puanlama');}
if(tab==='racon'||tab==='mekan'){const type=tab==='racon'?'racon':'mekan';const rules=(state?.giftRules||[]).map((r,i)=>({...r,i})).filter(r=>r.type===type);const members=type==='racon'?(state?.raconMembers||[]):(state?.mekanMembers||[]);h='<div class="card"><h2>'+(type==='racon'?'👑 Racon Kralları':'🏠 Mekan Sahibi')+'</h2><p class="muted">Hediyeyi listeden seç. O hediye geldiğinde gönderen otomatik listeye eklenir.</p><div class="row">'+giftSelect(type+'Gift')+'<button class="btn" onclick="addRule(\''+type+'\')">➕ Hediyeyi Aktif Et</button></div><div class="list" style="margin-top:12px">'+(rules.map(r=>'<div class="item"><span>🎁 '+esc(r.gift)+'</span><div class="row"><span class="pill">'+(r.active?'🟢 Aktif':'⚪ Pasif')+'</span><button class="btn dark" onclick="toggleRule('+r.i+')">Aç/Kapat</button><button class="btn danger" onclick="deleteRule('+r.i+')">Sil</button></div></div>').join('')||'<div class="muted">Henüz hediye seçilmedi.</div>')+'</div></div><div class="card"><div class="row"><h3 style="margin-right:auto">Otomatik Liste</h3><button class="btn danger" onclick="resetList(\''+type+'\')">Sıfırla</button></div><div class="list">'+(members.map((m,i)=>'<div class="item"><span>'+(i<3?['🥇','🥈','🥉'][i]:i+1)+ ' @'+esc(m.username)+' · '+esc(m.gift)+'</span><b>'+m.count+'x</b></div>').join('')||'<div class="muted">Hediye gelince burada görünecek.</div>')+'</div></div>'+overlayCard(type);}
if(tab==='likes')h='<div class="card"><div class="row"><h2 style="margin-right:auto">❤️ Beğeni Sıralaması</h2><button class="btn danger" onclick="resetLikes()">Sıfırla</button></div><div class="list">'+((state?.likes||[]).map((m,i)=>'<div class="item"><span>'+(i<3?['🥇','🥈','🥉'][i]:i+1)+ ' @'+esc(m.username)+'</span><b>'+Number(m.likeCount).toLocaleString('tr-TR')+' ❤️</b></div>').join('')||'<div class="muted">Henüz beğeni yok.</div>')+'</div></div>'+overlayCard('begeni');
if(tab==='win')h='<div class="card"><h2>🏆 WIN Sayacı</h2><div class="stat">'+String(state?.wins||0).padStart(2,'0')+'/20</div><div class="row" style="margin-top:14px"><button class="btn" onclick="win(1)">+ WIN</button><button class="btn danger" onclick="win(-1)">- WIN</button><button class="btn gold" onclick="win(0)">SIFIRLA</button></div></div>'+overlayCard('win');
if(tab==='test')h='<div class="card"><h2>🧪 Test Merkezi</h2><p class="muted">Gerçek TikTok olayı gelmiş gibi test et.</p><div class="row"><input class="field" id="testUser" value="test_kullanici"><input class="field" id="testScore" type="number" min="1" max="10" value="10"><button class="btn" onclick="testVote()">⭐ Test Puanı</button></div><div class="row" style="margin-top:10px">'+giftSelect('testGift')+'<input class="field" id="testRepeat" type="number" min="1" value="1" style="width:90px"><button class="btn" onclick="testGift()">🎁 Test Hediye</button></div><div class="row" style="margin-top:10px"><input class="field" id="testLikes" type="number" value="100"><button class="btn" onclick="testLike()">❤️ Test Beğeni</button></div></div>';
if(tab==='guide')h='<div class="card"><h2>📖 Kullanım Rehberi</h2><ol class="guide"><li>YENİ YAYIN BAŞLAT ile Room oluştur.</li><li>TikTok kullanıcı adını bağla.</li><li>Racon/Mekan hediyelerini listeden aktif et.</li><li>Puanlama süresini ayarla ve başlat.</li><li>Overlay linkini OBS veya TikTok Live Studio Browser Source olarak kullan.</li></ol></div>';
app.innerHTML=h;}
async function connectTikTok(){const d=await post('/api/connect',{username:document.getElementById('ttuser').value});toast(d.message||'');}
async function saveDuration(){await post('/api/duration',{duration:Number(document.getElementById('duration').value)});toast('Süre kaydedildi.');}
async function startScore(){await post('/api/score/start');toast('Puanlama başladı.');}
async function stopScore(){await post('/api/score/stop');toast('Puanlama bitti.');}
async function addRule(type){const gift=document.getElementById(type+'Gift').value;await post('/api/rule',{gift,type});toast('Hediye aktif edildi.');}
async function toggleRule(index){await post('/api/rule/toggle',{index});}
async function deleteRule(index){await post('/api/rule/delete',{index});}
async function resetList(type){await post('/api/'+type+'/reset');}
async function resetLikes(){await post('/api/likes/reset');}
async function win(change){await post('/api/win',{change});}
async function testVote(){await post('/api/test/vote',{username:document.getElementById('testUser').value,score:Number(document.getElementById('testScore').value)});}
async function testGift(){await post('/api/test/gift',{username:document.getElementById('testUser').value,gift:document.getElementById('testGift').value,repeatCount:Number(document.getElementById('testRepeat').value)});}
async function testLike(){await post('/api/test/like',{username:document.getElementById('testUser').value,count:Number(document.getElementById('testLikes').value)});}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.tab)));document.getElementById('newShow').onclick=()=>location.href='/';
render('connection');getState();setInterval(getState,1000);
</script></body></html>
