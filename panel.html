<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MS Yayın Paneli</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">🔥 MS <span>YAYIN</span></div>
      <nav id="menu">
        <button data-view="connection">🔴 Yayın Bağlantısı</button>
        <button data-view="score">⭐ Puanlama</button>
        <button data-view="racon">👑 Racon Kralları</button>
        <button data-view="mekan">🏠 Mekan Sahibi</button>
        <button data-view="likes">❤️ Beğeni Sıralaması</button>
        <button data-view="win">🏆 WIN Sayacı</button>
        <button data-view="test">🧪 Test Merkezi</button>
        <button data-view="guide">📖 Kullanım Rehberi</button>
      </nav>
      <button id="newRoom" class="secondary full">➕ Yeni Yayın</button>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h1>Yayın Yönetim Paneli</h1>
          <div class="muted">Bütün sistemler aynı Room'a bağlı çalışır.</div>
        </div>
        <div class="room-pill">ROOM: <strong id="roomLabel">—</strong></div>
      </header>

      <section id="connection" class="view"></section>
      <section id="score" class="view hidden"></section>
      <section id="racon" class="view hidden"></section>
      <section id="mekan" class="view hidden"></section>
      <section id="likes" class="view hidden"></section>
      <section id="win" class="view hidden"></section>
      <section id="test" class="view hidden"></section>
      <section id="guide" class="view hidden"></section>
    </main>
  </div>

<script>
const qs = new URLSearchParams(location.search);
const room = (qs.get('room') || localStorage.getItem('ms_room') || '').toUpperCase();
let state = null;
const els = id => document.getElementById(id);
const overlayBase = location.origin + '/overlay?room=' + encodeURIComponent(room);

if (!room) {
  window.location.href = '/';
}
localStorage.setItem('ms_room', room);
els('roomLabel').textContent = room;

function api(url, body, method='POST') {
  return fetch(url, {
    method,
    headers: {'Content-Type':'application/json'},
    body: body === undefined ? undefined : JSON.stringify({...body, room})
  }).then(async response => {
    const text = await response.text();
    let data;
    try { data = JSON.parse(text); } catch (_) { throw new Error('Sunucudan JSON yerine başka bir cevap geldi: ' + text.slice(0,120)); }
    if (!response.ok || data.ok === false) throw new Error(data.error || 'İşlem başarısız.');
    return data;
  });
}

function esc(value) {
  return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]));
}

function renderAll() {
  if (!state) return;
  renderConnection(); renderScore(); renderRacon(); renderMekan(); renderLikes(); renderWin(); renderTest(); renderGuide();
}

function renderConnection() {
  els('connection').innerHTML = `
    <div class="card"><h2>🔴 Yayın Bağlantısı</h2>
      <p class="muted">TikTok canlı kullanıcı adını gir. Panel ve bütün overlay'lar bu Room üzerinden veriyi kullanır.</p>
      <div class="form-row"><input id="ttUser" placeholder="@kullanici" value="${esc(state.username)}"><button class="primary" id="connectTikTok">BAĞLAN</button></div>
      <div class="status ${state.connected ? 'ok':'bad'}">${state.connected ? '🟢 TikTok bağlantısı aktif' : '🔴 TikTok bağlantısı kapalı'}</div>
      ${state.error ? `<div class="error">${esc(state.error)}</div>` : ''}
    </div>
    <div class="card"><h3>🎥 Overlay Linkleri</h3><p class="muted">OBS / TikTok Live Studio'da Browser Source olarak kullan.</p>
      ${overlayRow('Puanlama','puanlama')}${overlayRow('Racon Kralları','racon')}${overlayRow('Mekan Sahibi','mekan')}${overlayRow('Beğeni Sıralaması','begeni')}${overlayRow('WIN','win')}
    </div>`;
  els('connectTikTok').onclick = async () => {
    try { const data = await api('/api/connect', {username: els('ttUser').value}); state = data.state; renderAll(); }
    catch (e) { alert(e.message); }
  };
}

function overlayRow(name, type) {
  const url = `${overlayBase}&type=${encodeURIComponent(type)}`;
  return `<div class="link-row"><span>${name}</span><code>${esc(url)}</code><button class="small" data-copy="${esc(url)}">Kopyala</button></div>`;
}

function renderScore() {
  const remaining = state.scoring ? Math.max(0, Math.ceil((state.scoreEndsAt - Date.now())/1000)) : 0;
  els('score').innerHTML = `
    <div class="card"><h2>⭐ Puanlama</h2>
      <div class="form-row"><label>Süre (saniye)<input id="scoreDuration" type="number" min="1" max="3600" value="${state.scoreDuration}"></label>
      <button class="secondary" id="saveDuration">Süreyi Kaydet</button>
      <button class="primary" id="startScore">${state.scoring ? '🟢 DEVAM EDİYOR' : '▶ PUANLAMAYI BAŞLAT'}</button>
      <button class="danger" id="stopScore">⏹ BİTİR</button></div>
    </div>
    <div class="stats-grid"><div class="stat-card"><span>Ortalama</span><b>${state.average}</b></div><div class="stat-card"><span>Katılımcı</span><b>${state.participants}</b></div><div class="stat-card"><span>Kalan</span><b>${remaining} sn</b></div></div>
    <div class="card"><div class="section-title"><h3>Oylar (yeniden eskiye)</h3><span class="badge">1–10</span></div><div class="list">${state.votes.length ? state.votes.map(v=>`<div class="list-item"><span>@${esc(v.username)}</span><b>${v.score}</b></div>`).join('') : '<div class="muted">Henüz oy yok.</div>'}</div></div>`;
  els('saveDuration').onclick = async () => { try { state=(await api('/api/settings',{duration:Number(els('scoreDuration').value)})).state; renderAll(); } catch(e){ alert(e.message); } };
  els('startScore').onclick = async () => { try { state=(await api('/api/score/start',{})).state; renderAll(); } catch(e){ alert(e.message); } };
  els('stopScore').onclick = async () => { try { state=(await api('/api/score/stop',{})).state; renderAll(); } catch(e){ alert(e.message); } };
}

const giftOptions = ['Gül','Galaxy','TikTok Universe','Lion','Lionel Messi','Falcon','Finger Heart','Drama Queen','Ice Cream','Confetti'];
function giftSelect(id, current='') { return `<select id="${id}"><option value="">Hediye seç...</option>${giftOptions.map(g=>`<option value="${esc(g)}" ${current===g?'selected':''}>🎁 ${esc(g)}</option>`).join('')}<option value="__custom">✏️ Özel hediye...</option></select>`; }

function renderRacon() {
  els('racon').innerHTML = `<div class="card"><h2>👑 Racon Kralları</h2><p class="muted">Seçtiğin hediye gerçekten geldiğinde gönderen otomatik olarak listeye eklenir.</p><div class="form-row">${giftSelect('raconGift')}<button class="primary" id="addRacon">Hediyeyi Aktif Et</button></div><div class="chips">${state.raconRules.map(g=>`<span class="chip">🎁 ${esc(g)} <button data-remove-racon="${esc(g)}">×</button></span>`).join('')}</div></div>
  <div class="card"><div class="section-title"><h3>👑 Gelenler</h3><a class="small-link" target="_blank" href="${overlayBase}&type=racon">Overlay'ı Aç</a></div><div class="list">${state.raconEntries.length ? state.raconEntries.map((e,i)=>`<div class="list-item"><span>${i+1}. @${esc(e.username)} <small>• ${esc(e.gift)}</small></span><b>${e.count}x</b></div>`).join('') : '<div class="muted">Henüz seçili hediye gelmedi.</div>'}</div></div>`;
  els('addRacon').onclick = async () => { const gift=await chosenGift('raconGift'); if(gift) addRule('racon',gift); };
  document.querySelectorAll('[data-remove-racon]').forEach(b=>b.onclick=()=>removeRule('racon',b.dataset.removeRacon));
}

function renderMekan() {
  els('mekan').innerHTML = `<div class="card"><h2>🏠 Mekan Sahibi</h2><p class="muted">Seçtiğin hediye geldiğinde gönderen otomatik olarak Mekan Sahibi listesine eklenir.</p><div class="form-row">${giftSelect('mekanGift')}<button class="primary" id="addMekan">Hediyeyi Aktif Et</button></div><div class="chips">${state.mekanRules.map(g=>`<span class="chip">🎁 ${esc(g)} <button data-remove-mekan="${esc(g)}">×</button></span>`).join('')}</div></div>
  <div class="card"><div class="section-title"><h3>🏠 Gelenler</h3><a class="small-link" target="_blank" href="${overlayBase}&type=mekan">Overlay'ı Aç</a></div><div class="list">${state.mekanEntries.length ? state.mekanEntries.map((e,i)=>`<div class="list-item"><span>${i+1}. @${esc(e.username)} <small>• ${esc(e.gift)}</small></span><b>${e.count}x</b></div>`).join('') : '<div class="muted">Henüz seçili hediye gelmedi.</div>'}</div></div>`;
  els('addMekan').onclick = async () => { const gift=await chosenGift('mekanGift'); if(gift) addRule('mekan',gift); };
  document.querySelectorAll('[data-remove-mekan]').forEach(b=>b.onclick=()=>removeRule('mekan',b.dataset.removeMekan));
}

async function chosenGift(id) {
  const value=els(id).value;
  if(value==='__custom') { const custom=prompt('Hediyenin TikTok üzerindeki tam adını yaz:'); return custom ? custom.trim() : ''; }
  return value;
}
async function addRule(category,gift){ try{state=(await api('/api/rules',{category,gift})).state;renderAll();}catch(e){alert(e.message);} }
async function removeRule(category,gift){ try{state=(await api('/api/rules',{category,gift},'DELETE')).state;renderAll();}catch(e){alert(e.message);} }

function renderLikes() {
  els('likes').innerHTML = `<div class="card"><div class="section-title"><div><h2>❤️ Beğeni Sıralaması</h2><p class="muted">Canlıdan gelen beğeniler kullanıcı bazında toplanır ve büyükten küçüğe sıralanır.</p></div><button class="danger" id="resetLikes">Sıfırla</button></div><div class="list ranked">${state.likes.length ? state.likes.map((x,i)=>`<div class="list-item"><span>${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.'} @${esc(x.username)}</span><b>${Number(x.likeCount).toLocaleString('tr-TR')} ❤️</b></div>`).join('') : '<div class="muted">Henüz beğeni yok.</div>'}</div></div>`;
  els('resetLikes').onclick=async()=>{try{state=(await api('/api/likes/reset',{})).state;renderAll();}catch(e){alert(e.message);}};
}

function renderWin() {
  els('win').innerHTML = `<div class="card center"><h2>🏆 WIN Sayacı</h2><div class="win-number">${String(state.wins).padStart(2,'0')}<span>/20</span></div><div class="form-row center-row"><button class="primary" id="winPlus">+1 WIN</button><button class="danger" id="winMinus">-1 WIN</button><button class="secondary" id="winReset">Sıfırla</button></div><div class="penalty">CEZA: <b>-${state.penalty}</b></div></div>`;
  els('winPlus').onclick=async()=>win(1);els('winMinus').onclick=async()=>win(-1);els('winReset').onclick=async()=>{try{state=(await api('/api/win',{reset:true})).state;renderAll();}catch(e){alert(e.message);}};
}
async function win(change){try{state=(await api('/api/win',{change})).state;renderAll();}catch(e){alert(e.message);}}

function renderTest() {
  els('test').innerHTML = `<div class="card"><h2>🧪 Test Merkezi</h2><p class="muted">TikTok'tan olay gelmiş gibi deneyebilirsin. Gerçek yayına veri göndermez.</p>
  <div class="test-block"><h3>⭐ Test Puanı</h3><div class="form-row"><input id="testVoteUser" value="test_kullanici" placeholder="kullanici"><input id="testVoteScore" type="number" min="1" max="10" value="10"><button class="primary" id="sendVote">Gönder</button></div></div>
  <div class="test-block"><h3>🎁 Test Hediye</h3><div class="form-row"><input id="testGiftUser" value="hediye_atan" placeholder="kullanici"><input id="testGiftName" value="Galaxy" placeholder="Hediye adı"><button class="primary" id="sendGift">Gönder</button></div></div>
  <div class="test-block"><h3>❤️ Test Beğeni</h3><div class="form-row"><input id="testLikeUser" value="like_kral" placeholder="kullanici"><input id="testLikeCount" type="number" value="250"><button class="primary" id="sendLike">Gönder</button></div></div>
  <div class="test-block"><h3>👀 Hızlı Overlay</h3><div class="form-row"><a class="secondary as-button" target="_blank" href="${overlayBase}&type=puanlama">Puanlama</a><a class="secondary as-button" target="_blank" href="${overlayBase}&type=racon">Racon</a><a class="secondary as-button" target="_blank" href="${overlayBase}&type=mekan">Mekan</a><a class="secondary as-button" target="_blank" href="${overlayBase}&type=begeni">Beğeni</a><a class="secondary as-button" target="_blank" href="${overlayBase}&type=win">WIN</a></div></div></div>`;
  els('sendVote').onclick=async()=>{try{state=(await api('/api/test/vote',{username:els('testVoteUser').value,score:Number(els('testVoteScore').value)})).state;renderAll();}catch(e){alert(e.message);}};
  els('sendGift').onclick=async()=>{try{state=(await api('/api/test/gift',{username:els('testGiftUser').value,gift:els('testGiftName').value})).state;renderAll();}catch(e){alert(e.message);}};
  els('sendLike').onclick=async()=>{try{state=(await api('/api/test/like',{username:els('testLikeUser').value,count:Number(els('testLikeCount').value)})).state;renderAll();}catch(e){alert(e.message);}};
}

function renderGuide() {
  els('guide').innerHTML = `<div class="card"><h2>📖 Kullanım Rehberi</h2><ol class="guide"><li><b>Yeni Yayın Başlat</b>'a bas. Room kodun otomatik oluşur.</li><li><b>Yayın Bağlantısı</b> bölümünden TikTok kullanıcı adını bağla.</li><li><b>Racon Kralları</b> ve <b>Mekan Sahibi</b> bölümlerinden tetikleyici hediyeleri seç.</li><li><b>Puanlama</b> bölümünde süreyi istediğin saniyeye ayarla.</li><li>Overlay linkini OBS / TikTok Live Studio'da Browser Source olarak ekle.</li><li>Gerçek yayına geçmeden önce <b>Test Merkezi</b> ile hepsini dene.</li></ol><div class="note">⚠️ Not: Room verileri şu an sunucunun RAM'inde tutulur. Render ücretsiz servis uykuya geçtiğinde geçici veriler sıfırlanabilir. Kalıcı kayıt için daha sonra veritabanı ekleyebiliriz.</div></div>`;
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden', v.id !== id));
  document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('active', b.dataset.view===id));
}

document.querySelectorAll('#menu button').forEach(button => button.addEventListener('click',()=>showView(button.dataset.view)));
els('newRoom').onclick=()=>{ if(confirm('Yeni yayın odası oluşturulsun mu? Mevcut Room aynı kalır.')) window.location.href='/'; };
document.addEventListener('click', event => {
  const button = event.target.closest('[data-copy]');
  if (!button) return;
  navigator.clipboard?.writeText(button.dataset.copy).then(()=>{ const old=button.textContent;button.textContent='Kopyalandı';setTimeout(()=>button.textContent=old,1000); });
});

async function load(){
  try{
    const response=await fetch('/api/state?room='+encodeURIComponent(room));
    const data=await response.json();
    if(!response.ok || !data.ok) throw new Error(data.error || 'Room bulunamadı.');
    state=data.state;renderAll();showView('connection');
  }catch(e){ alert(e.message); window.location.href='/'; }
}
load();
setInterval(async()=>{
  try{const r=await fetch('/api/state?room='+encodeURIComponent(room));const d=await r.json();if(d.ok){state=d.state;const active=document.querySelector('.view:not(.hidden)')?.id || 'connection';renderAll();showView(active);}}catch(_){}}
, 1000);
</script>
</body>
</html>
